name: Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Set up Rust MSVC
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Prepare release assets
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = 'src-tauri/target/release'
          Copy-Item -LiteralPath "$files/superexplore.exe" -Destination "$files/SuperExplore-portable-x64.exe"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $name = "SuperExplore $tag"
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $tag = "main-$($env:GITHUB_SHA.Substring(0, 12))"
            $name = "SuperExplore · $tag"
          } else {
            $tag = "build-$($env:GITHUB_SHA.Substring(0, 12))"
            $name = "SuperExplore · $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.release.outputs.name }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/SuperExplore-portable-x64.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
